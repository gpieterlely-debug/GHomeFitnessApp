# Generate the Xcode project on a Mac:  brew install xcodegen && cd App && xcodegen
name: RectusRecovery
options:
  bundleIdPrefix: com.example.rectusrecovery   # change to your own prefix
  deploymentTarget:
    iOS: "17.0"
packages:
  RectusRecoveryCore:
    path: ..
targets:
  RectusRecovery:
    type: application
    platform: iOS
    sources: [RectusRecovery]
    dependencies:
      - package: RectusRecoveryCore
      - sdk: HealthKit.framework
    entitlements:
      path: RectusRecovery/RectusRecovery.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: RectusRecovery/Info.plist
      properties:
        CFBundleDisplayName: Rectus Recovery
        UILaunchScreen: {}
        NSHealthShareUsageDescription: >-
          Rectus Recovery reads steps, distance, workouts, heart rate, resting heart rate and sleep
          to show your activity alongside your symptoms. This data never unlocks exercises or counts as medical clearance.
